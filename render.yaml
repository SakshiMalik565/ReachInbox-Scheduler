services:
  # 1. ReachInbox Full-Stack Application (API + BullMQ Worker + React Dashboard)
  - type: web
    name: reachinbox-app
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build:shared && npm run prisma:generate && npm run build:web && npm run build:api
    startCommand: npx prisma db push --schema apps/api/prisma/schema.prisma && npm run start --workspace=@reachinbox/api
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: RUN_INLINE_WORKER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: reachinbox-redis
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        value: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - key: WORKER_CONCURRENCY
        value: "5"
      - key: MIN_DELAY_BETWEEN_EMAILS_MS
        value: "2000"
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: "100"

  # 2. Redis Key-Value Store for BullMQ & Rate Limiter
  - type: keyvalue
    name: reachinbox-redis
    plan: free
    ipAllowList: []

databases:
  # 3. Managed PostgreSQL Database
  - name: reachinbox-db
    plan: free
    databaseName: reachinbox
    user: reachinbox_user
